name: Coffee C market snapshot

on:
  schedule:
    # 14:30 UTC is after the ICE Coffee C session and delayed data update.
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Collect and persist Coffee C snapshot
        run: npx tsx --tsconfig tsconfig.json scripts/collect-coffee-market-snapshot.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CFTC_APP_TOKEN: ${{ secrets.CFTC_APP_TOKEN }}

      - name: Update Coffee C historical chart data
        env:
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WEBSITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::WEBSITE_URL and CRON_SECRET repository secrets are required to update historical chart data."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            "${WEBSITE_URL%/}/api/coffee/update-history"
