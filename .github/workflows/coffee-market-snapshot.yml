name: Coffee C market snapshot

on:
  schedule:
    # 14:30 UTC is after the ICE Coffee C session and delayed data update.
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect and persist Coffee C snapshot
        run: npx tsx --tsconfig tsconfig.json scripts/collect-coffee-market-snapshot.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CFTC_APP_TOKEN: ${{ secrets.CFTC_APP_TOKEN }}
